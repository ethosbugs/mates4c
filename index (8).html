<!DOCTYPE html>
<html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matemàtiques 4t ESO - Nombres reals</title>
<style>
:root{--r1:#fff1f1;--r2:#fbd3d3;--r3:#ec7f7f;--r4:#c8202a;--r5:#8f0f18;--r6:#4a0509}
*{box-sizing:border-box}body{margin:0;display:flex;font:16px/1.65 "Segoe UI",system-ui,sans-serif;color:#2a1214;background:var(--r1)}
aside{width:280px;flex:none;background:linear-gradient(170deg,var(--r4),var(--r6));color:#fff;padding:22px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font:700 27px Georgia,serif;margin:0 8px}.sub{margin:0 8px 14px;opacity:.75}
nav h5{margin:16px 8px 4px;font-size:14px;color:var(--r2);font-weight:600}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:#fff;padding:8px 10px;font:inherit;cursor:pointer;transition:.2s}
nav button:hover{background:rgba(255,255,255,.14);padding-left:16px}nav button.on{background:var(--r1);color:var(--r4);border-left-color:var(--r2);font-weight:600}
main{flex:1;min-width:0;max-width:960px;padding:0 36px 80px}
.hero{margin:0 -36px 24px;padding:36px 36px 26px;background:linear-gradient(120deg,var(--r5),var(--r4) 60%,var(--r3));color:#fff;animation:in .5s}
.hero h2{font:700 38px Georgia,serif;margin:0}.hero p{margin:4px 0 0;opacity:.85}
h3{font:700 23px Georgia,serif;color:var(--r5);margin:34px 0 8px;padding-left:12px;border-left:6px solid var(--r4)}
h4{color:var(--r4);margin:22px 0 4px;font-size:18px}
.th>*,.card{animation:in .45s both}.th>*:nth-child(2){animation-delay:.06s}.th>*:nth-child(3){animation-delay:.12s}.th>*:nth-child(n+4){animation-delay:.18s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.box{background:var(--r2);border-left:6px solid var(--r4);padding:10px 16px;margin:12px 0;font-size:18px}
.ex{background:#fff;border:1px solid var(--r2);border-top:4px solid var(--r3);padding:8px 16px;margin:12px 0}.ex ol{margin:6px 0;padding-left:22px}.exq{font-weight:600;font-size:18px;color:var(--r5)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0;font-size:18px}.flow span{background:#fff;border:2px solid var(--r3);padding:6px 14px}.flow span:last-child{background:var(--r4);color:#fff;border-color:var(--r4)}.flow em{color:var(--r4);font-style:normal;font-weight:700}
table{border-collapse:collapse;margin:12px 0;background:#fff;width:100%}td,th{border:1px solid var(--r2);padding:7px 11px}th{background:var(--r4);color:#fff;text-align:left}tr:nth-child(even) td{background:var(--r1)}
.figs{display:flex;flex-wrap:wrap;gap:14px}.figs figure{margin:0;background:#fff;border:1px solid var(--r2);padding:8px;text-align:center;flex:1;min-width:210px}figcaption{font-size:14px;color:var(--r5)}
svg text{font:700 15px Georgia,serif;fill:var(--r6)}img.sch{max-width:100%;border:3px solid var(--r3);background:#fff}
.card{background:#fff;border:1px solid var(--r2);border-left:8px solid var(--r4);padding:14px 20px;margin:16px 0}.card h4{margin:0 0 4px;color:var(--r5)}
.q{font-size:21px;margin:8px 0;font-weight:600}.ans ol{margin:8px 0;padding-left:22px}.ans li{animation:in .4s both}.ans li:nth-child(2){animation-delay:.15s}.ans li:nth-child(3){animation-delay:.3s}.ans li:nth-child(n+4){animation-delay:.45s}
.fin{background:var(--r4);color:#fff;padding:8px 14px;margin-top:8px;font-weight:600;font-size:18px}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bt button,.tb{padding:8px 16px;font:inherit;cursor:pointer;border:2px solid var(--r4);transition:.2s}.b1,.tb{background:var(--r4);color:#fff}.b2{background:#fff;color:var(--r4)}.bt button:hover,.tb:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--r6)}
button:focus-visible,input:focus-visible{outline:3px solid #000;outline-offset:2px}
.test ol{padding-left:28px}.test li{margin:12px 0;font-size:19px;padding:4px 8px;border-left:5px solid transparent}.test li.ok{border-color:#1f7a3a;background:#e6f5ea}.test li.ko{border-color:var(--r4);background:var(--r2)}
.test input{width:76px;font:inherit;padding:3px 6px;border:2px solid var(--r4);margin:0 3px}.sc{font:700 24px Georgia,serif;color:var(--r5);margin:10px 0}
.rd{display:inline-flex;align-items:baseline;margin:0 2px}.rd i{font-size:.62em;font-style:normal;position:relative;top:-.5em;margin-right:-1px}.rd b{font-weight:400}.ov{border-top:2px solid currentColor;padding:0 3px;margin-left:1px}
.fr{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 4px;font-size:.95em;line-height:1.3}.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 5px}
@media(max-width:800px){body{display:block}aside{width:auto;height:auto;position:static}nav{display:flex;flex-wrap:wrap}nav button{width:auto}main{padding:0 16px 60px}.hero{margin:0 -16px 20px;padding:24px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside><h1>Nombres reals</h1><p class="sub">Matemàtiques 4t ESO</p><nav id="nav"></nav></aside><main id="main"></main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)];
const sp=(a,e)=>e===1?''+a:a+'<sup>'+e+'</sup>';
const r=(n,x)=>`<span class="rd">${n!=2?'<i>'+n+'</i>':''}<b>√</b><span class="ov">${x}</span></span>`;
const f=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),lcm=(a,b)=>a*b/gcd(a,b),dc=x=>x.toFixed(2).replace('.',',');
const fac=N=>{const F={};for(let p=2;p*p<=N;p++)while(N%p==0){F[p]=(F[p]||0)+1;N/=p}if(N>1)F[N]=(F[N]||0)+1;return F};
const fs=F=>Object.keys(F).map(p=>sp(p,F[p])).join(' · ');
const simp=(n,N)=>{const F=fac(N);let k=1,m=1;for(const p in F){k*=Math.pow(p,Math.floor(F[p]/n));m*=Math.pow(p,F[p]%n)}return[k,m]};
const T=(k,n,m)=>{const c=Math.abs(k),s=k<0?'−':'';return m==1?s+c:s+(c==1?'':c)+r(n,m)};
const res=(a,b,m)=>{let s=a?(a<0?'−'+(-a):''+a):'';if(b){const c=Math.abs(b);s+=(s?(b<0?' − ':' + '):(b<0?'−':''))+(c==1?'':c)+r(2,m)}return s||'0'};
const fr=(n,d)=>d==1?n:f(n,d),nm=x=>String(x).replace('-','−');
const sq=s=>{const[k,m]=simp(2,s);return m==1?''+k:T(k,2,m)+' ≈ '+dc(Math.sqrt(s))};
const lin=(c1,m1,c2,m2)=>(c1<0?'−':'')+(Math.abs(c1)==1?'':Math.abs(c1))+r(2,m1)+(c2<0?' − ':' + ')+(Math.abs(c2)==1?'':Math.abs(c2))+r(2,m2);

const CL=[['12',0,'Nombre natural.'],['0',1,'El zero no és natural en aquest esquema: és enter.'],['−4',1,'Enter negatiu.'],['0,25',2,'Decimal exacte: 0,25 = 1/4.'],['π',3,'Infinits decimals no periòdics.'],['2,71828… (e)',3,'Infinits decimals no periòdics.']];
const SETS=[['N','Z','Q','R'],['Z','Q','R'],['Q','R'],['I (irracional)','R']];
const cls=()=>{const t=R(0,4);let x,l,rs;
if(t==0)[x,l,rs]=P(CL);
else if(t==1){const N=P([2,3,5,6,7,8,10,11,12,13,14,15,17,18,19,20,21,22,23,24,26,27,28,29,30]);x=r(2,N);l=3;rs=`${r(2,N)} no és una arrel exacta: infinits decimals sense període.`}
else if(t==2){const k=R(2,15),n=Math.random()<.4;x=(n?'−':'')+r(2,k*k);l=n?1:0;rs=`${r(2,k*k)} = ${k}, així que ${n?'és un enter negatiu':'és natural'}.`}
else if(t==3){const q=R(3,9);x=f(R(1,q-1),q);l=2;rs='És una fracció de dos enters: racional.'}
else{const d=R(1,9),e=R(1,9),mx=Math.random()<.5;x=mx?`0,${d}${e}${e}${e}…`:`0,${d}${e}${d}${e}${d}${e}…`;l=2;rs=mx?'Decimal periòdic mixt (hi ha una part no periòdica abans del període): racional.':'Decimal periòdic pur: racional.'}
return{q:'A quins conjunts pertany <b>'+x+'</b>? (N, Z, Q, I, R)',st:['Simplifica si és una arrel exacta, i mira si és fracció, decimal o irracional.',rs],a:SETS[l].join(', ')}};

const pit=()=>{const t=R(0,4);
if(t==0){const a=R(2,12),b=R(2,12),s=a*a+b*b;return{q:`Triangle rectangle amb catets <b>a = ${a}</b> i <b>b = ${b}</b>. Calcula la hipotenusa.`,st:['h² = a² + b²',`h² = ${sp(a,2)} + ${sp(b,2)} = ${a*a} + ${b*b} = ${s}`,`h = ${r(2,s)}`],a:'h = '+sq(s)}}
if(t==1){const h=R(6,15),a=R(2,h-1),s=h*h-a*a;return{q:`Triangle rectangle amb hipotenusa <b>h = ${h}</b> i un catet <b>a = ${a}</b>. Calcula l'altre catet.`,st:['Aïllem el catet: b² = h² − a²',`b² = ${sp(h,2)} − ${sp(a,2)} = ${h*h} − ${a*a} = ${s}`,`b = ${r(2,s)}`],a:'b = '+sq(s)}}
if(t==2){const D=2*R(3,9),d=2*R(3,9),s=(D/2)**2+(d/2)**2,x=Math.sqrt(s);return{q:`Un rombe té diagonals de <b>${D}</b> i <b>${d}</b>. Calcula'n el perímetre.`,st:['Les diagonals es tallen en angle recte i es divideixen per la meitat: apareix un triangle rectangle amb catets D/2 i d/2.',`Catets: ${D}/2 = ${D/2} i ${d}/2 = ${d/2}`,`Costat: x² = ${sp(D/2,2)} + ${sp(d/2,2)} = ${s}, x = ${r(2,s)} ≈ ${dc(x)}`,'Perímetre = 4 · x'],a:'P = 4 · '+sq(s)+' ≈ '+dc(4*x)}}
if(t==3){const l=R(5,20),w=R(2,l-1),s=l*l+w*w;return{q:`Un rectangle fa <b>${l}</b> de llarg i <b>${w}</b> d'ample. Quant mesura la diagonal?`,st:['La diagonal divideix el rectangle en dos triangles rectangles: és la hipotenusa.',`d² = ${sp(l,2)} + ${sp(w,2)} = ${s}`,`d = ${r(2,s)}`],a:'d = '+sq(s)}}
const b=2*R(2,8),s=R(b/2+1,b/2+8),h2=s*s-(b/2)**2;return{q:`Un triangle isòsceles té base <b>${b}</b> i costats iguals de <b>${s}</b>. Calcula'n l'altura.`,st:['L\'altura el divideix en dos triangles rectangles amb base b/2.',`h² = ${sp(s,2)} − ${sp(b/2,2)} = ${s*s} − ${(b/2)**2} = ${h2}`,`h = ${r(2,h2)}`],a:'h = '+sq(h2)}};

const pot=()=>{const t=R(0,4);
if(t==0){const b=R(2,5),e=R(2,5),n=Math.random()<.6,B=n?`(−${b})`:''+b;return{q:`Calcula ${B}<sup>${e}</sup>`,st:[`${B}<sup>${e}</sup> = ${Array(e).fill(B).join(' · ')}`,n?`Base negativa: exponent ${e%2?'senar, resultat negatiu':'parell, resultat positiu'}.`:'Base positiva: resultat positiu.'],a:nm(Math.pow(n?-b:b,e))}}
if(t==1){let p,q;do{p=R(1,4);q=R(2,5)}while(gcd(p,q)>1);const e=R(2,4),n=Math.random()<.5,ng=n&&e%2;return{q:`Calcula (${n?'−':''}${f(p,q)})<sup>${e}</sup>`,st:['(a/b)ⁿ = aⁿ/bⁿ',`Signe: ${ng?'negatiu (base negativa i exponent senar)':'positiu'}`,`${sp(p,e)} = ${p**e} i ${sp(q,e)} = ${q**e}`],a:(ng?'−':'')+f(p**e,q**e)}}
if(t==2){const a=P([2,3,5]),n=R(2,5),m=n+R(1,4);return Math.random()<.5?{q:`Simplifica: ${sp(a,m)} · ${sp(a,n)}`,st:['Mateixa base: se sumen els exponents.',`${m} + ${n} = ${m+n}`],a:`${sp(a,m+n)} = ${a**(m+n)}`}:{q:`Simplifica: ${sp(a,m)} : ${sp(a,n)}`,st:['Mateixa base: es resten els exponents.',`${m} − ${n} = ${m-n}`],a:`${sp(a,m-n)} = ${a**(m-n)}`}}
if(t==3){const a=P([2,3,5]),m=R(2,4),n=R(2,3);return{q:`Simplifica: (${sp(a,m)})<sup>${n}</sup>`,st:['Potència d\'una potència: es multipliquen els exponents.',`${m} · ${n} = ${m*n}`],a:sp(a,m*n)}}
const a=R(2,5),n=R(2,3);return{q:`Escriu amb exponent positiu i calcula: ${sp(a,-n).replace('-','−')}`,st:['a⁻ⁿ = 1/aⁿ',`${sp(a,n)} = ${a**n}`],a:f(1,a**n)}};

const exf=()=>{const t=R(0,2),a=P([2,3,5,7]),n=R(2,5),m=R(1,4),g=gcd(m,n);
if(t==0)return{q:'Expressa amb exponent fraccionari: '+r(n,sp(a,m)),st:['ⁿ√(aᵐ) = a<sup>m/n</sup>: l\'exponent del radicand va al numerador i l\'índex al denominador.',`n = ${n}, m = ${m}`,g>1?`Simplifiquem ${m}/${n} = ${m/g}/${n/g}`:'La fracció ja és irreductible.'],a:`${a}<sup>${m/g}/${n/g}</sup>`};
if(t==1)return{q:`Expressa com a radical: ${a}<sup>${m}/${n}</sup>`,st:['a<sup>m/n</sup> = ⁿ√(aᵐ)','El denominador és l\'índex i el numerador l\'exponent del radicand.'],a:r(n,sp(a,m))};
const b=P([2,3,4,5]),k=P([2,3]),e=R(1,3);return{q:`Calcula: ${Math.pow(b,k)}<sup>${e}/${k}</sup>`,st:[`Descomposem la base: ${Math.pow(b,k)} = ${sp(b,k)}`,`(${sp(b,k)})<sup>${e}/${k}</sup> = ${b}<sup>${k}·${e}/${k}</sup> = ${sp(b,e)}`],a:''+Math.pow(b,e)}};

const eqv=()=>{const t=R(0,2);
if(t==0){const a=P([2,3,5,7]),g=R(2,3),n=g*P([2,3]),m=g*R(1,3),k=gcd(n,m);return{q:`Simplifica el radical: ${r(n,sp(a,m))}`,st:[`mcd(${n}, ${m}) = ${k}`,`Dividim índex i exponent entre ${k}: ${n}/${k} = ${n/k} i ${m}/${k} = ${m/k}`],a:r(n/k,sp(a,m/k))}}
if(t==1){const i=P([2,3,4]),j=P([3,4,6].filter(v=>v!=i)),x=P([2,3,5]),y=P([2,3,5,7]),L=lcm(i,j);return{q:`Redueix a índex comú: ${r(i,x)} i ${r(j,y)}`,st:[`mcm(${i}, ${j}) = ${L}`,`Primer radical: multipliquem índex i exponent per ${L/i}`,`Segon radical: multipliquem índex i exponent per ${L/j}`],a:`${r(L,sp(x,L/i))} i ${r(L,sp(y,L/j))}`}}
const a=P([2,3,5,7]),n=R(2,4),m=R(1,3),k=R(2,3);return{q:`Escriu un radical equivalent a ${r(n,sp(a,m))} d'índex ${n*k}`,st:[`Multipliquem l'índex per ${k}: ${n}·${k} = ${n*k}`,`Multipliquem l'exponent pel mateix nombre: ${m}·${k} = ${m*k}`],a:r(n*k,sp(a,m*k))}};

const ext=()=>{const t=R(0,3);
if(t<2){const n=t?3:2,k=R(2,7),m=P([2,3,5,6,7]),N=Math.pow(k,n)*m,[kk,mm]=simp(n,N);return{q:`Extreu factors: ${r(n,N)}`,st:[`Factoritzem: ${N} = ${fs(fac(N))}`,`Cada factor surt de l'arrel dividint el seu exponent entre l'índex (${n}).`,'Els factors que no arriben a l\'índex es queden dins.'],a:T(kk,n,mm)}}
if(t==2){const n=P([2,3]),k=R(2,6),m=P([2,3,5,6,7]);return{q:`Introdueix dins de l'arrel: ${k}${r(n,m)}`,st:[`El factor ${k} entra elevat a l'índex: ${sp(k,n)} = ${Math.pow(k,n)}`,`Multipliquem pel radicand: ${Math.pow(k,n)} · ${m} = ${Math.pow(k,n)*m}`],a:r(n,Math.pow(k,n)*m)}}
const k=R(2,4),m=R(2,4),a=R(2,5),N=k*k*m;return{q:`Extreu factors: ${r(2,sp(a,3)+' · '+N)}`,st:[`Factoritzem: ${N} = ${fs(fac(N))}`,`Agrupem tot el radicand: ${sp(a,3)} · ${fs(fac(N))}`,'Traiem de l\'arrel tot el que es pot.'],a:'Treu '+a+'·'+k+' = '+a*k+' i la resta es queda dins: '+(()=>{const[q1,m1]=simp(2,Math.pow(a,3)*N);return T(q1,2,m1)})()}};

const ops=()=>{const t=R(0,6);
if(t==0){const m=P([2,3,5,7]),c=R(2,3),ts=[];let tot=0;for(let i=0;i<c;i++)ts.push({p:R(1,4),k:R(1,6),s:i?P([1,-1]):1});
const q=ts.map((x,i)=>(i?(x.s>0?' + ':' − '):'')+(x.p>1?x.p:'')+r(2,x.k*x.k*m)).join('');const st=[];
ts.forEach(x=>{const N=x.k*x.k*m;tot+=x.s*x.p*x.k;st.push(`${r(2,N)} = ${r(2,fs(fac(N)))} = ${T(x.k,2,m)}; amb el coeficient: ${x.p} · ${x.k} = ${x.p*x.k}`)});
st.push('Tots els radicals són semblants: sumem els coeficients.','Coeficients: '+ts.map((x,i)=>(i?(x.s>0?' + ':' − '):'')+x.p*x.k).join('')+' = '+nm(tot));return{q:'Calcula extraient factors: '+q,st,a:tot==0?'0':T(tot,2,m)}}
if(t==1){const x=R(2,12),y=R(2,12),[k,m]=simp(2,x*y);return{q:`Calcula: ${r(2,x)} · ${r(2,y)}`,st:['Mateix índex: √a · √b = √(a·b)',`${r(2,x)} · ${r(2,y)} = ${r(2,x*y)}`,'Extraiem factors si és possible.'],a:T(k,2,m)}}
if(t==2){const a=R(2,4),b=R(2,4),x=R(2,8),y=R(2,8),[k,m]=simp(2,x*y);return{q:`Calcula: ${a}${r(2,x)} · ${b}${r(2,y)}`,st:['Multipliquem coeficients entre ells i radicals entre ells.',`${a}·${b} = ${a*b} i ${r(2,x)}·${r(2,y)} = ${r(2,x*y)}`,`Extraiem factors: ${r(2,x*y)} = ${T(k,2,m)}`],a:T(a*b*k,2,m)}}
if(t==3){const y=P([2,3,5]),k=R(2,6),x=k*k*y;return{q:`Calcula: ${f(r(2,x),r(2,y))}`,st:['Mateix índex: √a / √b = √(a/b)',`${x} : ${y} = ${k*k}`,`${r(2,k*k)} = ${k}`],a:''+k}}
if(t==4){const a=P([2,3,5]),b=P([2,3,5]);return{q:`Calcula: ${r(2,a)} · ${r(3,b)}`,st:['Índexs diferents: reduïm a índex comú, mcm(2, 3) = 6.',`${r(2,a)} = ${r(6,sp(a,3))} i ${r(3,b)} = ${r(6,sp(b,2))}`,`${r(6,sp(a,3))} · ${r(6,sp(b,2))} = ${r(6,a**3*b**2)}`],a:r(6,a**3*b**2)}}
if(t==5){const a=P([2,3,5,7]);return Math.random()<.5?{q:`Simplifica: ${r(2,r(3,a))}`,st:['Arrel d\'una arrel: es multipliquen els índexs.','2 · 3 = 6'],a:r(6,a)}:{q:`Simplifica: ${r(3,r(2,a))}`,st:['Arrel d\'una arrel: es multipliquen els índexs.','3 · 2 = 6'],a:r(6,a)}}
const a=P([2,3,5,7]);return{q:`Calcula: (${r(2,a)})<sup>3</sup>`,st:[`(${r(2,a)})³ = ${r(2,a)} · ${r(2,a)} · ${r(2,a)}`,`${r(2,a)} · ${r(2,a)} = ${a}`,`${a} · ${r(2,a)}`],a:a+r(2,a)}};

const rac=()=>{const t=R(0,3);
if(t==0){const a=R(1,9),b=P([2,3,5,6,7,10]),g=gcd(a,b),A=a/g,B=b/g;return{q:`Racionalitza: ${f(a,r(2,b))}`,st:[`Multipliquem numerador i denominador per ${r(2,b)}`,`${f(a+' · '+r(2,b),r(2,b)+' · '+r(2,b))} = ${f(a+r(2,b),b)}`,g>1?`Simplifiquem dividint entre ${g}`:'No es pot simplificar més.'],a:fr((A==1?'':A)+r(2,b),B)}}
if(t==1){const a=R(1,9),c=R(2,6),d=P([2,3,5,7]),s=P([1,-1]);let A=a*c,B=-a*s,D=c*c-d;if(D<0){A=-A;B=-B;D=-D}const g=gcd(gcd(A,B),D);return{q:`Racionalitza: ${f(a,c+(s>0?' + ':' − ')+r(2,d))}`,st:[`Multipliquem pel conjugat: ${c} ${s>0?'−':'+'} ${r(2,d)}`,`Denominador: (a + b)(a − b) = a² − b² → ${sp(c,2)} − ${d} = ${c*c-d}`,`Numerador: ${a}·(${c} ${s>0?'−':'+'} ${r(2,d)}) = ${res(a*c,-a*s,d)}`,g>1?`Simplifiquem dividint entre ${g}`:'Mirem si es pot simplificar.'],a:fr(res(A/g,B/g,d),D/g)}}
if(t==2){const n=P([3,4,5]),m=R(1,n-1),x=P([2,3,5]),a=R(1,9),c=a%x==0?a/x:a,den=a%x==0?1:x;return{q:`Racionalitza: ${f(a,r(n,sp(x,m)))}`,st:[`Multipliquem pel radical que completa l'exponent fins a ${n}: ${r(n,sp(x,n-m))}`,`Denominador: ${r(n,sp(x,m))} · ${r(n,sp(x,n-m))} = ${r(n,sp(x,n))} = ${x}`,`Numerador: ${a} · ${r(n,sp(x,n-m))}`],a:fr((c==1?'':c)+r(n,sp(x,n-m)),den)}}
let b,c;do{b=P([2,3,5,6,7,10]);c=P([2,3,5,6,7,10])}while(b==c);const a=R(1,6),s=P([1,-1]);let c1=a,c2=-s*a,D=b-c;if(D<0){c1=-c1;c2=-c2;D=-D}const g=gcd(gcd(c1,c2),D);
return{q:`Racionalitza: ${f(a,r(2,b)+(s>0?' + ':' − ')+r(2,c))}`,st:[`Conjugat: ${r(2,b)} ${s>0?'−':'+'} ${r(2,c)}`,`Denominador: (√${b})² − (√${c})² = ${b} − ${c} = ${b-c}`,`Numerador: ${a}·(${r(2,b)} ${s>0?'−':'+'} ${r(2,c)})`],a:fr(lin(c1/g,b,c2/g,c),D/g)}};

const tm=([c,m])=>m==1?''+c:(c>1?c:'')+r(2,m);
const idn=(t,p)=>{p=p||{};if(t==null)t=R(0,2);let A=p.A,B=p.B;
if(!A){const rad=()=>[P([1,1,2,3]),P([2,3,5,6,7])],it=()=>[R(2,7),1],k=R(0,2);A=k==2?it():rad();B=k==0?it():rad();if(k==1&&A[1]==B[1])B[1]=A[1]==2?3:2}
const A2=A[0]**2*A[1],B2=B[0]**2*B[1];
if(t==2)return{q:`(${tm(A)} + ${tm(B)})(${tm(A)} − ${tm(B)})`,st:['Suma per diferència: (a + b)(a − b) = a² − b²',`a² = (${tm(A)})² = ${A2}`,`b² = (${tm(B)})² = ${B2}`,`${A2} − ${B2}`],a:nm(A2-B2)};
const s=t==0?1:-1,[k,mm]=simp(2,A[1]*B[1]),cr=2*A[0]*B[0]*k,sg=s>0?'+':'−';
return{q:`(${tm(A)} ${sg} ${tm(B)})²`,st:[`(a ${sg} b)² = a² ${sg} 2ab + b²`,`a² = (${tm(A)})² = ${A2}`,`2ab = 2 · ${tm(A)} · ${tm(B)} = ${mm==1?cr:res(0,cr,mm)}`,`b² = (${tm(B)})² = ${B2}`,'Agrupem els termes semblants.'],a:mm==1?nm(A2+B2+s*cr):res(A2+B2,s*cr,mm)}};
const idp=()=>{const b=P([2,3,5]),n=R(2,3),c=R(1,5),v=b**n,t=R(0,2),sg=t==1?'−':'+';
if(t==2)return{q:`(${sp(b,n)} + ${c})(${sp(b,n)} − ${c})`,st:['(a + b)(a − b) = a² − b²',`a² = (${sp(b,n)})² = ${sp(b,2*n)} = ${v*v}`,`b² = ${c*c}`],a:''+(v*v-c*c)};
return{q:`(${sp(b,n)} ${sg} ${c})²`,st:[`(a ${sg} b)² = a² ${sg} 2ab + b²`,`a² = (${sp(b,n)})² = ${sp(b,2*n)} = ${v*v} (potència d'una potència)`,`2ab = 2 · ${v} · ${c} = ${2*v*c}`,`b² = ${c*c}`],a:''+(v*v+(t==1?-1:1)*2*v*c+c*c)}};
const cm=()=>{if(Math.random()<.5){const t=R(2,9)*10,u=R(1,3),s=P([1,-1]),x=t+s*u;return{q:`Calcula mentalment ${x}²`,st:[`Escrivim ${x} = ${t} ${s>0?'+':'−'} ${u}`,`(${t} ${s>0?'+':'−'} ${u})² = ${t}² ${s>0?'+':'−'} 2·${t}·${u} + ${u}²`,`${t*t} ${s>0?'+':'−'} ${2*t*u} + ${u*u}`],a:''+x*x}}
const t=P([20,30,40,50,100]),k=R(1,5);return{q:`Calcula mentalment ${t-k} · ${t+k}`,st:['Suma per diferència: (a − b)(a + b) = a² − b²',`${t}² − ${k}² = ${t*t} − ${k*k}`],a:''+(t*t-k*k)}};

const I='@',pw=(a,e)=>sp(a,e);

const TB=[()=>{const a=R(2,5),n=R(2,5);if(a**n>700)return TB[0]();const g=Math.random()<.3&&n%2;return[`${g?'(−'+a+')':a}<sup>${n}</sup> = ${I}`,g?-(a**n):a**n]},()=>{const a=P([2,3,5]),n=R(2,5),m=R(1,4);return[`${a}<sup>${m}/${n}</sup> = ${r(n,pw(a,I))}`,m]},()=>{const a=P([2,3,5]),n=R(2,5),m=R(1,4);return[`${r(n,pw(a,m))} = ${a}<sup>${I}/${n}</sup>`,m]},()=>{const a=P([2,3,5]),n=R(2,5),m=R(1,4);return[`${r(n,pw(a,m))} = ${a}<sup>${m}/${I}</sup>`,n]},()=>{let n1,m1;do{n1=R(2,4);m1=R(2,5)}while(gcd(n1,m1)>1);const g=R(2,3),a=P([2,3,5]);return[`${r(n1*g,pw(a,m1*g))} = ${r(n1,pw(a,I))}`,m1]},()=>{const a=R(2,12);return[`${r(2,pw(a,2))} = ${I}`,a]},()=>{const n=P([2,3]),b=R(2,n==3?5:6);return[`${b**n}<sup>1/${n}</sup> = ${I}`,b]},()=>{const a=P([2,3,5,7]);return[`${a}<sup>1/2</sup> = ${r(2,I)}`,a]}];
const TC=[()=>{const k=R(2,30);return[`${r(2,k*k)} = ${I}`,k]},()=>{const k=R(2,10);return[`${r(3,k**3)} = ${I}`,k]},()=>{const a=R(2,9),b=a+R(1,3);return[`${r(2,f(a*a,b*b))} = ${f(I,b)}`,a]},()=>{const a=R(2,15),b=R(2,15);return[`${r(2,a*a)} + ${r(2,b*b)} = ${I}`,a+b]},()=>{const a=R(2,12),b=R(2,9);return[`${r(2,a*a)} · ${r(2,b*b)} = ${I}`,a*b]},()=>{const a=R(2,30);return[`(${r(2,a*a-1+1+R(0,0))})<sup>2</sup> = ${I}`,a*a]},()=>{const a=R(10,30);return[`${r(2,a*a)} − ${r(2,R(2,9)**2)} = ${I}`,null]}].slice(0,6);

const TE=[()=>{const t=R(2,9)*10,u=R(1,2),x=t+P([1,-1])*u;return[`${x}² = ${I}`,x*x]},()=>{const t=P([20,30,40,50,100]),k=R(1,5);return[`${t-k} · ${t+k} = ${I}`,t*t-k*k]},()=>{const m=P([2,3,5,6,7,10]),k=R(1,4);return[`(${r(2,m)} + ${k})(${r(2,m)} − ${k}) = ${I}`,m-k*k]},()=>{const m=R(2,11),n=m+R(1,6);return[`(${r(2,n)} + ${r(2,m)})(${r(2,n)} − ${r(2,m)}) = ${I}`,n-m]},()=>{const a=R(2,9);return[`(${r(2,a*a+1)})<sup>2</sup> − 1 = ${I}`,a*a]}].map(g=>g);

{t:'Esquema dels nombres reals',s:'Quin tipus de nombre és?',th:`<img class="sch" alt="Esquema dels nombres reals" src="${IMG}">
<p>Els <b>nombres reals (R)</b> són tots els que es poden situar a la recta numèrica. Es divideixen en <b>racionals</b> (es poden escriure com a fracció) i <b>irracionals</b> (no es poden escriure com a fracció).</p>
<h4>Com classificar un nombre, pas a pas</h4>${flow('Simplifica les arrels','És decimal? Mira si acaba o té període','Exacte o periòdic: Q','Cap de les dues: irracional')}
<div class="box"><b>Decimal periòdic pur:</b> el període comença just després de la coma (0,333…).<br><b>Decimal periòdic mixt:</b> hi ha xifres que no es repeteixen abans del període (0,1666…).</div>
<table><tr><th>Nombre</th><th>Conjunts</th></tr><tr><td>7</td><td>N, Z, Q, R</td></tr><tr><td>−3</td><td>Z, Q, R</td></tr><tr><td>0,25 o 2/3</td><td>Q, R</td></tr><tr><td>${r(2,2)} o π</td><td>I, R</td></tr></table>`,g:[{n:'Classifica el nombre',f:cls}]},
{t:'Teorema de Pitàgores',s:'Triangles rectangles i problemes geomètrics',th:`<p>En un triangle <b>rectangle</b>, el quadrat de la hipotenusa (el costat oposat a l'angle recte, el més llarg) és la suma dels quadrats dels catets.</p>
<div class="box">h² = a² + b² &nbsp;&nbsp; h = ${r(2,'a² + b²')} &nbsp;&nbsp; a = ${r(2,'h² − b²')}</div>
<div class="figs"><figure>${SVG(220,170,'<polygon points="25,145 25,25 185,145" fill="#fbd3d3" stroke="#c8202a" stroke-width="3"/><path d="M25 128h17v17" fill="none" stroke="#4a0509" stroke-width="2"/><text x="6" y="90">a</text><text x="100" y="164">b</text><text x="112" y="76">h</text>')}<figcaption>Triangle rectangle: catets a i b, hipotenusa h</figcaption></figure>
<figure>${SVG(220,170,'<polygon points="110,10 200,85 110,160 20,85" fill="#fbd3d3" stroke="#c8202a" stroke-width="3"/><line x1="110" y1="10" x2="110" y2="160" stroke="#4a0509" stroke-dasharray="5"/><line x1="20" y1="85" x2="200" y2="85" stroke="#4a0509" stroke-dasharray="5"/><text x="116" y="55">d/2</text><text x="55" y="80">D/2</text><text x="150" y="40">x</text>')}<figcaption>Rombe: x² = (D/2)² + (d/2)²</figcaption></figure>
<figure>${SVG(220,170,'<rect x="15" y="25" width="190" height="115" fill="#fbd3d3" stroke="#c8202a" stroke-width="3"/><line x1="15" y1="140" x2="205" y2="25" stroke="#4a0509" stroke-width="2.5"/><text x="100" y="158">llarg l</text><text x="150" y="95">d</text><text x="22" y="90">ample</text>')}<figcaption>Rectangle: d = √(l² + a²)</figcaption></figure>
<figure>${SVG(220,170,'<rect x="15" y="25" width="190" height="115" fill="#fbd3d3" stroke="#c8202a" stroke-width="3"/><circle cx="110" cy="82" r="57" fill="#fff" stroke="#8f0f18" stroke-width="3"/><line x1="110" y1="25" x2="110" y2="140" stroke="#4a0509" stroke-dasharray="4"/><text x="118" y="86">diàmetre</text>')}<figcaption>Circumferència: L = π · d</figcaption></figure></div>
<h4>Com resoldre un problema</h4>${flow('Dibuixa la figura','Troba el triangle rectangle','Hipotenusa o catet?','Aplica la fórmula i extreu l\'arrel','Respon amb unitats')}
${ex('Exemple: catets 5 i 12',['h² = 5² + 12² = 25 + 144 = 169',`h = ${r(2,169)} = 13`],'h = 13')}
${ex('Exemple: hipotenusa 7 i catet 4',['b² = 7² − 4² = 49 − 16 = 33',`b = ${r(2,33)} ≈ 5,74`],'b ≈ 5,74')}
<div class="box">Camp Nou (105 m × 68 m): la diagonal és ${r(2,'105² + 68²')} = ${r(2,15649)} ≈ 125,10 m. La circumferència del porter (diàmetre 68 m) és π · 68 ≈ 213,63 m. Multiplica pel nombre de voltes i passa a km dividint entre 1000. Comprova a l'enunciat què inclou el circuit dels defenses.</div>`,g:[{n:'Problemes de Pitàgores',f:pit}]},
{t:'Potències i propietats',s:'Totes les regles, amb exemples',th:`<p>aⁿ = a · a · … · a (n factors). <b>a</b> és la base i <b>n</b> l'exponent.</p>
<table><tr><th>Propietat</th><th>Fórmula</th><th>Exemple</th></tr><tr><td>Producte, mateixa base</td><td>aᵐ · aⁿ = aᵐ⁺ⁿ</td><td>2³ · 2⁴ = 2⁷</td></tr><tr><td>Quocient, mateixa base</td><td>aᵐ : aⁿ = aᵐ⁻ⁿ</td><td>5⁶ : 5² = 5⁴</td></tr><tr><td>Potència d'una potència</td><td>(aᵐ)ⁿ = aᵐ·ⁿ</td><td>(3²)³ = 3⁶</td></tr><tr><td>Producte, mateix exponent</td><td>aⁿ · bⁿ = (a·b)ⁿ</td><td>2³ · 5³ = 10³</td></tr><tr><td>Quocient, mateix exponent</td><td>aⁿ : bⁿ = (a:b)ⁿ</td><td>6² : 3² = 2²</td></tr><tr><td>Fracció</td><td>(a/b)ⁿ = aⁿ/bⁿ</td><td>(2/3)³ = 8/27</td></tr><tr><td>Exponent 0 i negatiu</td><td>a⁰ = 1, a⁻ⁿ = 1/aⁿ</td><td>2⁻³ = 1/8</td></tr></table>
<div class="box"><b>Signes:</b> base negativa i exponent parell: positiu. Base negativa i exponent senar: negatiu. Compte: (−2)⁴ = 16, però −2⁴ = −16.<br>La suma i la resta de potències no tenen propietat: es calcula cada potència i després se sumen (2³ + 2² = 8 + 4 = 12).</div>
${ex('Exemple combinat: (2³ · 2⁵) : 2⁴',['Mateixa base: 2³ · 2⁵ = 2⁸','2⁸ : 2⁴ = 2⁴'],'2⁴ = 16')}${ex('Exemple: (3² · 3⁴)² ',['3² · 3⁴ = 3⁶','(3⁶)² = 3¹²'],'3¹²')}`,g:[{n:'Potències i propietats',f:pot}]},
{t:'Radicals i exponent fraccionari',s:'Arrel i potència són el mateix',th:`<div class="box" style="font-size:24px;text-align:center">${r('n',sp('a','m')).replace('<i>n</i>','<i>n</i>')} = a<sup>m/n</sup></div>
<p><b>n</b> és l'índex (va al denominador) i <b>m</b> l'exponent del radicand (va al numerador).</p>${flow(r(3,sp(5,2)),'5<sup>2/3</sup>')}${flow('7<sup>3/4</sup>',r(4,sp(7,3)))}
<h4>Resoldre una arrel exacta</h4>${flow(r(2,144),'Factoritzem: 2<sup>4</sup> · 3<sup>2</sup>','Dividim exponents entre 2: 2<sup>2</sup> · 3','12')}
${ex(`Calcula ${r(3,216)}`,['216 = 2³ · 3³',`${r(3,'2³ · 3³')} = 2 · 3`],'6')}
<ul><li>Índex parell d'un nombre negatiu: no és un nombre real.</li><li>Índex senar d'un negatiu: sí que existeix, ${r(3,'−8')} = −2.</li><li>(√a)² = a, i ${r(2,'a²')} = a.</li></ul>`,g:[{n:'Radical i exponent fraccionari',f:exf}]},
{t:'Radicals equivalents',s:'Simplificar i reduir a índex comú',th:`<p>Dos radicals són equivalents si valen el mateix. Es manté el valor si es multiplica (o es divideix) l'índex i l'exponent del radicand pel mateix nombre.</p><div class="box">${r('n',sp('a','m'))} = ${r('n·p',sp('a','m·p'))}</div>
<h4>Simplificar</h4>${flow(r(6,sp(2,4)),'mcd(6, 4) = 2','Dividim entre 2',r(3,sp(2,2)))}
<h4>Reduir a índex comú</h4>${ex(`Redueix ${r(2,3)} i ${r(3,2)}`,['mcm(2, 3) = 6',`${r(2,3)} = ${r(6,sp(3,3))} = ${r(6,27)}`,`${r(3,2)} = ${r(6,sp(2,2))} = ${r(6,4)}`],'Comparant: 27 > 4, per tant √3 > ∛2')}`,g:[{n:'Radicals equivalents',f:eqv}]},
{t:'Extreure i introduir factors',s:'Entra i surt de l\'arrel',th:`<h4>Extreure factors</h4>${flow('Descompon el radicand','Agrupa de n en n (n = índex)','Treu un factor per cada grup')}
${ex(`${r(2,72)}`,['72 = 2³ · 3²',`${r(2,'2³ · 3²')} = 2 · 3 · ${r(2,2)}`],`6${r(2,2)}`)}
${ex(`${r(3,54)}`,['54 = 2 · 3³',`${r(3,'2 · 3³')} = 3 · ${r(3,2)}`],`3${r(3,2)}`)}
${ex(`${r(2,200)}`,['200 = 2³ · 5²',`${r(2,'2³ · 5²')} = 2 · 5 · ${r(2,2)}`],`10${r(2,2)}`)}
<h4>Introduir factors</h4>${flow('El factor entra elevat a l\'índex','Es multiplica pel radicand')}
${ex(`3${r(2,2)}`,['3² = 9','9 · 2 = 18'],r(2,18))}${ex(`2${r(3,5)}`,['2³ = 8','8 · 5 = 40'],r(3,40))}`,g:[{n:'Extreu o introdueix factors',f:ext}]},
{t:'Operacions amb radicals',s:'Esquema complet i exemples',th:`<table><tr><th>Operació</th><th>Regla</th><th>Exemple</th></tr>
<tr><td>Suma i resta</td><td>Només radicals semblants: a${r(2,'m')} ± b${r(2,'m')} = (a ± b)${r(2,'m')}</td><td>3${r(2,2)} + 5${r(2,2)} = 8${r(2,2)}</td></tr>
<tr><td>Producte</td><td>${r(2,'a')} · ${r(2,'b')} = ${r(2,'a·b')}</td><td>${r(2,3)} · ${r(2,6)} = ${r(2,18)} = 3${r(2,2)}</td></tr>
<tr><td>Producte amb coeficients</td><td>a${r(2,'x')} · b${r(2,'y')} = ab${r(2,'xy')}</td><td>2${r(2,3)} · 5${r(2,2)} = 10${r(2,6)}</td></tr>
<tr><td>Quocient</td><td>${r(2,'a')} : ${r(2,'b')} = ${r(2,'a:b')}</td><td>${r(2,20)} : ${r(2,5)} = ${r(2,4)} = 2</td></tr>
<tr><td>Índexs diferents</td><td>Índex comú (mcm) i després operar</td><td>${r(2,2)} · ${r(3,3)} = ${r(6,8)} · ${r(6,9)} = ${r(6,72)}</td></tr>
<tr><td>Arrel d'una arrel</td><td>Es multipliquen els índexs</td><td>${r(2,r(3,5))} = ${r(6,5)}</td></tr>
<tr><td>Potència d'un radical</td><td>(${r(2,'a')})³ = a${r(2,'a')}</td><td>(${r(2,2)})³ = 2${r(2,2)}</td></tr></table>
<div class="box">Atenció: ${r(2,'a')} + ${r(2,'b')} no és ${r(2,'a + b')}.</div>
<h4>Exemples complets de sumes</h4>
${ex(`${r(2,8)} + ${r(2,162)}`,[`${r(2,8)} = ${r(2,'2³')} = 2${r(2,2)}`,`${r(2,162)} = ${r(2,'2 · 3⁴')} = 9${r(2,2)}`,`2${r(2,2)} + 9${r(2,2)}`],`11${r(2,2)}`)}
${ex(`4${r(2,72)} − 5${r(2,18)} + 3${r(2,8)}`,[`${r(2,72)} = 6${r(2,2)}, ${r(2,18)} = 3${r(2,2)}, ${r(2,8)} = 2${r(2,2)}`,`4·6${r(2,2)} − 5·3${r(2,2)} + 3·2${r(2,2)} = 24${r(2,2)} − 15${r(2,2)} + 6${r(2,2)}`,'24 − 15 + 6 = 15'],`15${r(2,2)}`)}`,g:[{n:'Operacions amb radicals',f:ops}]},
{t:'Racionalització',s:'Treure arrels del denominador',th:`<p>Racionalitzar és eliminar els radicals del denominador sense canviar el valor: es multiplica numerador i denominador pel mateix.</p>
<h4>Cas 1: arrel quadrada</h4><div class="box">${f('a',r(2,'b'))} = ${f('a'+r(2,'b'),'b')}</div>${ex(`${f(4,r(2,8))}`,[`Multipliquem per ${r(2,8)}: ${f(4+r(2,8),8)}`,`${r(2,8)} = 2${r(2,2)}: ${f('4 · 2'+r(2,2),8)}`],r(2,2)+' (simplificant)')}
<h4>Cas 2: arrel d'índex n</h4><div class="box">${f('a',r('n',sp('x','m')))} → multipliquem per ${r('n',sp('x','n−m'))}</div>${ex(`${f(5,r(3,sp(5,2)))}`,[`Multipliquem per ${r(3,5)} per completar l'exponent 3`,`${f(5+r(3,5),r(3,sp(5,3)))} = ${f(5+r(3,5),5)}`],r(3,5))}
<h4>Cas 3: binomi, amb el conjugat</h4><div class="box">${f('a',r(2,'b')+' + c')} → conjugat: ${r(2,'b')} − c, i (x + y)(x − y) = x² − y²</div>${ex(`${f(6,'2 − '+r(2,2))}`,[`Conjugat: 2 + ${r(2,2)}`,`Denominador: 2² − 2 = 2`,`Numerador: 6 · (2 + ${r(2,2)}) = 12 + 6${r(2,2)}`,`${f('12 + 6'+r(2,2),2)}`],`6 + 3${r(2,2)}`)}${ex(`${f(4,r(2,10)+' − '+r(2,8))}`,[`Conjugat: ${r(2,10)} + ${r(2,8)}`,'Denominador: 10 − 8 = 2',`Numerador: 4${r(2,10)} + 4${r(2,8)}`],`2${r(2,10)} + 2${r(2,8)} = 2${r(2,10)} + 4${r(2,2)}`)}`,g:[{n:'Racionalitza',f:rac}]},
{t:'Identitats notables',s:'Tres fórmules, nou exemples i aplicacions',th:`<p>Són productes que es desenvolupen directament. Amb radicals recorda que (${r(2,'m')})² = m i ${r(2,'m')} · ${r(2,'n')} = ${r(2,'mn')}.</p>
${idSec(0,'Cas 1: quadrat d\'una suma','(a + b)² = a² + 2ab + b²',ids)}${idSec(1,'Cas 2: quadrat d\'una diferència','(a − b)² = a² − 2ab + b²',idm)}${idSec(2,'Cas 3: suma per diferència','(a + b)(a − b) = a² − b²',idd)}
<h4>Aplicacions al càlcul mental</h4>${exg(cm())}${exg(cm())}
<h4>Amb potències</h4>${exg(idp())}`,g:[{n:'Desenvolupa identitats amb radicals',f:idn},{n:'Identitats amb potències',f:idp},{n:'Càlcul mental amb identitats',f:cm}]}];
function card(g){const d=document.createElement('div');d.className='card';d.innerHTML=`<h4>${g.n}</h4><div class="q"></div><div class="ans"></div><div class="bt"><button class="b1">Nou exercici</button><button class="b2">Mostra el procediment</button></div>`;let cur;const nw=()=>{cur=g.f();d.querySelector('.q').innerHTML=cur.q;d.querySelector('.ans').innerHTML=''};
d.querySelector('.b1').onclick=nw;d.querySelector('.b2').onclick=()=>{d.querySelector('.ans').innerHTML='<ol>'+cur.st.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="fin">Resposta: '+cur.a+'</div>'};nw();return d}
function test(gens){const d=document.createElement('div');d.className='test';let qs;const mk=()=>{qs=[];const seen={};for(let i=0;i<300&&qs.length<10;i++){const x=P(gens)();if(x[1]==null||seen[x[0]])continue;seen[x[0]]=1;qs.push(x)}
d.innerHTML='<ol>'+qs.map(x=>'<li>'+x[0].split(I).join('<input type="number" step="any" aria-label="Resposta">')+'<span></span></li>').join('')+'</ol><div class="bt"><button class="tb" id="ck">Corregeix</button><button class="tb" id="nw">Nou test</button></div><div class="sc"></div>';
d.querySelector('#nw').onclick=mk;d.querySelector('#ck').onclick=()=>{let ok=0;[...d.querySelectorAll('li')].forEach((li,i)=>{const v=li.querySelector('input').value,g=v!==''&&Math.abs(+v-qs[i][1])<1e-9;ok+=g;li.className=g?'ok':'ko';li.querySelector('span').textContent=g?'':'  Resposta: '+String(qs[i][1]).replace('-','−')});d.querySelector('.sc').textContent='Puntuació: '+ok+' de '+qs.length}};mk();return d}
const nav=document.getElementById('nav'),main=document.getElementById('main'),items=[];
function show(i){const it=items[i];main.innerHTML=`<div class="hero"><h2>${it.t}</h2><p>${it.s}</p></div>`;if(it.test){main.append(test(it.test))}else{main.insertAdjacentHTML('beforeend','<section class="th">'+it.th+'</section><h3>Practica</h3>');it.g.forEach(g=>main.append(card(g)))}
[...nav.querySelectorAll('button')].forEach((b,j)=>b.classList.toggle('on',j==i));scrollTo(0,0)}
nav.insertAdjacentHTML('beforeend','<h5>Teoria i pràctica</h5>');SEC.forEach(s=>items.push(s));
const tx=document.createElement('h5');
SEC.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+s.t;b.onclick=()=>show(i);nav.append(b)});
nav.insertAdjacentHTML('beforeend','<h5>Tests de càlcul mental</h5>');
TESTS.forEach(([t,g])=>{const i=items.length;items.push({t,s:'10 preguntes sense calculadora. Omple els buits i corregeix.',test:g});const b=document.createElement('button');b.textContent=t.split(':')[0]+': '+t.split(': ')[1].split(',')[0];b.onclick=()=>show(i);nav.append(b)});
show(0);
</script></body></html>
